# The test suite runs `provenance init` in many throwaway repositories. Keep
# onboarding off the network and off the user's machine cache: the asset URL
# points at a refused loopback port and the caches at ignored target/ paths,
# so init takes its offline fallback path and no test imports a dictionary
# unless it sets its own PROVENANCE_TEST_STE100_ASSET_URL or imports a local
# PDF. Both cargo test and nextest apply this section to the processes they
# spawn.
[env]
PROVENANCE_TEST_STE100_ASSET_URL = "http://127.0.0.1:9/ASD-STE100_ISSUE9.pdf"
PROVENANCE_STE100_ASSET_DIR = { value = "target/test-ste100-assets", relative = true }
PROVENANCE_STE100_INDEX_DIR = { value = "target/test-ste100-indexes", relative = true }
