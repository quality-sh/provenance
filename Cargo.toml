[workspace]
members = [
    "crates/provenance-cli",
    "crates/provenance-core",
    "crates/provenance-macros",
    "crates/provenance-scanner",
    "crates/provenance-sdk",
    "crates/provenance-ste100",
    "crates/provenance-store",
]
resolver = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Doc-requirement lints are too noisy for an internal tool
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/quality-sh/provenance"
homepage = "https://github.com/quality-sh/provenance"
readme = "README.md"
publish = ["crates-io"]

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
axum = "0.8"
camino = { version = "1.1", features = ["serde1"] }
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
fs2 = "0.4"
fs_at = "0.2"
insta = "1.39"
jsonschema = "0.18"
pulldown-cmark = "0.10"
remove_dir_all = "1.0"
rustix = { version = "1.1", features = ["fs"] }
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3.10"
thiserror = "1.0"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"
uuid = { version = "1.10", features = ["v4"] }
toml = "0.8"
trybuild = "1.0"
predicates = "3.1"
provenance-core = { path = "crates/provenance-core", version = "0.2.2" }
provenance-macros = { path = "crates/provenance-macros", version = "0.2.2" }
provenance-scanner = { path = "crates/provenance-scanner", version = "0.2.2" }
provenance-ste100 = { path = "crates/provenance-ste100", version = "0.2.2" }
provenance-store = { path = "crates/provenance-store", version = "0.2.2" }
walkdir = "2.5"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
