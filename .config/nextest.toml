[profile.ci]
# Bound process concurrency even when the runner receives extra CPUs.
test-threads = 8
# The single-source process tests run a full nested Cargo build. The
# distribution shard of the Default-features CLI test runs them once per CI
# run; the other shard runs the rest of the provenance-cli tests.
# The simulation tests run only in the nightly simulation workflow, with the
# simulation profile. CI compiles them, but no CI job runs them.
default-filter = 'not binary(cli_skills_single_source) & not package(provenance-simulation) & not binary(/^simulation_cli/)'

[profile.ci.junit]
# target/nextest/ci/junit.xml; CI uploads it for TAG, the test aggregator.
path = "junit.xml"

# The nightly simulation. The ci profile leaves out every test of
# provenance-simulation, simulation_cli and simulation_cli_planted, so no CI
# job runs them. The
# random cases are also ignored tests, so a plain cargo test does not run
# them. The workflow passes --run-ignored all and sets HEGEL_SEED and
# HEGEL_TEST_CASES. simulation_cli runs the CLI layer.
[profile.simulation]
default-filter = 'package(provenance-simulation) | binary(/^simulation_cli/)'
fail-fast = false
slow-timeout = { period = "300s", terminate-after = 2 }

[[profile.simulation.overrides]]
# The random test of a layer runs all of its cases in one test. The engine
# and the contract jobs have 60 minutes and the CLI jobs 120, with the build
# in that time, so nextest stops a test before the job timeout and the job
# still uploads its log and failure files. A Hegel shrink stops at 300 s.
filter = 'package(provenance-simulation) & test(/^random_/)'
slow-timeout = { period = "300s", terminate-after = 8 }

[[profile.simulation.overrides]]
# 100 cases on Linux took 3,096 s with L6 after each write. The limit is 100
# minutes; with a build of about 7 minutes, the job of 120 minutes still has
# the time to report and upload after nextest stops the test.
filter = 'binary(simulation_cli) & test(/^random_/)'
slow-timeout = { period = "300s", terminate-after = 20 }

[test-groups.cargo]
max-threads = 1

[[profile.default.overrides]]
# PDF imports can cause HTTP timeouts under CPU contention. The mutex in
# this binary cannot serialize separate nextest processes.
filter = 'binary(cli_ste_onboarding)'
threads-required = "num-test-threads"
priority = 100

[[profile.default.overrides]]
# Each simulation runs a full PDF import against a 10s HTTP client, like
# cli_ste_onboarding. The mutex in this binary cannot serialize separate
# nextest processes.
filter = 'binary(cli_dogfood_simulate)'
threads-required = "num-test-threads"
priority = 95

[[profile.default.overrides]]
# These tests invoke Cargo. The derive tests also share trybuild output.
filter = 'binary(cargo_nested_sdk) | binary(compile_fail) | binary(relation_derive_refusals) | binary(projection_row_refusals) | binary(review_asset_rebuild)'
test-group = "cargo"
threads-required = 4
priority = 90

[[profile.default.overrides]]
# Real host event tests must fail within minutes if an operation stops.
filter = 'binary(/^cli_review_events/) & !test(repeat_kernel_queue_loss_thirty_times)'
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
# The manual stress check includes 30 repetitions but also has a process limit.
filter = 'binary(cli_review_events_recovery) & test(repeat_kernel_queue_loss_thirty_times)'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
# The read of this case waits, with no bound, for a write to commit beside
# it. A store that keeps that write from committing must fail the case in
# about a minute, not at the job timeout.
filter = 'package(provenance-store) & binary(read_database_contract) & test(=a_read_answers_from_one_committed_state)'
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
# A blocked OS lock cannot be cancelled by an async timeout.
filter = 'binary(page_write_response)'
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
# Slot tests hold work until the test releases it. A stuck test must fail in
# about a minute, not at the job timeout.
filter = 'package(provenance-transport) & (binary(host_queue) | binary(host_invocation))'
slow-timeout = { period = "30s", terminate-after = 2 }

[[profile.default.overrides]]
# The review record test takes about 8s. One CI run stalled in it for more than
# 80 minutes. A stall must fail the test in minutes and not hold the job.
filter = 'package(provenance-cli) & binary(cli_agent_review_records)'
slow-timeout = { period = "60s", terminate-after = 3 }
