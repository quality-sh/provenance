# https://docs.github.com/en/actions/tutorials/create-actions/create-a-composite-action
name: 'fix macos runner CA root bundles'
description: 'Remove compromised eMudhra certificates from preinstalled CA bundles'

runs:
  using: 'composite'
  steps:
    - name: 'fix /etc/ssl/cert.pem'
      if: ${{ contains(runner.os, 'macos') }}
      shell: bash
      run: |
        # https://emudhra.we-have-a-problem.com/#macos-curl
        # Remove this step when GitHub ships fixed macOS images: https://github.com/actions/runner-images/issues/15228
        ls -lA /etc/ssl/cert.pem
        t="$(mktemp)" && \
          awk -v s='=== /C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3' \
            '/^(===|###) /{skip=0} $0==s{skip=1} !skip' /etc/ssl/cert.pem | \
          awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign ECC Root CA - C3' \
            '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
          awk -v s='=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign Root CA - C1' \
            '/^(===|###) /{skip=0} $0==s{skip=1} !skip' | \
          awk -v s='=== /C=GB/ST=Greater Manchester/L=Salford/O=Comodo CA Limited/CN=AAA Certificate Services' \
            '/^(===|###) /{skip=0} $0==s{skip=1} !skip' > "$t" && \
          [ -s "$t" ] && sudo install -m 0644 -o root -g wheel "$t" /etc/ssl/cert.pem; rm -f "$t"
        ls -lA /etc/ssl/cert.pem
        if [ ! -s /etc/ssl/cert.pem ]; then
          echo '::error::/etc/ssl/cert.pem is empty after the rewrite'
          exit 1
        fi
        if grep -Fx \
          -e '=== /C=IN/OU=emSign PKI/O=eMudhra Technologies Limited/CN=emSign ECC Root CA - G3' \
          -e '=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign ECC Root CA - C3' \
          -e '=== /C=US/OU=emSign PKI/O=eMudhra Inc/CN=emSign Root CA - C1' \
          -e '=== /C=GB/ST=Greater Manchester/L=Salford/O=Comodo CA Limited/CN=AAA Certificate Services' \
          /etc/ssl/cert.pem; then
          echo '::error::/etc/ssl/cert.pem still contains a removed root'
          exit 1
        fi
        echo 'Check passed: /etc/ssl/cert.pem is not empty and contains none of the four removed roots'
