name: Install Socket Firewall
description: Install the pinned Socket Firewall Free CLI, verify its digest, and put it on PATH.

runs:
  using: composite
  steps:
    - name: Select the pinned sfw asset
      id: select
      shell: bash
      env:
        SFW_VERSION: '1.15.4'
      run: |
        set -euo pipefail
        # One pinned SocketDev/sfw-free release. The SHA-256 digest pins each
        # platform binary, so a changed asset fails the install step.
        case "${RUNNER_OS}:${RUNNER_ARCH}" in
          Linux:X64)     asset=sfw-free-linux-x86_64;       digest=cf9f55b8343e1ef6e6dcccdb09b99c70c0430a22ed7d0079286eccddeaf72670; name=sfw ;;
          Linux:ARM64)   asset=sfw-free-linux-arm64;        digest=c8c80aa582829f24f5d633f2c3f2ccd0b070bbee80bf3b956e5e2a9880184e20; name=sfw ;;
          macOS:ARM64)   asset=sfw-free-macos-arm64;        digest=1b705ea7c399727ee41aa93f63e0469d2c3787c50e1dd8842cb8ff5ceec9eb99; name=sfw ;;
          macOS:X64)     asset=sfw-free-macos-x86_64;       digest=b19f96f0dd3ebc4ecc7111dbc43cc2b095f37bf759273c0bd9c0c4784ea24731; name=sfw ;;
          Windows:X64)   asset=sfw-free-windows-x86_64.exe; digest=f8c94fc5e41d49c51d2fd013c2c169274df9c483fc763d8c82ff71c5579d3bb0; name=sfw.exe ;;
          Windows:ARM64) asset=sfw-free-windows-arm64.exe;  digest=16607f9c64055b8e0af918dc93a72a342ca8352f46e6e3f810d1a378a380a82a; name=sfw.exe ;;
          *) echo "Unsupported runner platform: ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
        esac
        {
          echo "version=$SFW_VERSION"
          echo "asset=$asset"
          echo "digest=$digest"
          echo "name=$name"
        } >> "$GITHUB_OUTPUT"

    # The cache holds the binary as downloaded. The install step checks its
    # digest on a hit as well as on a miss.
    - name: Restore the cached sfw binary
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/socket-firewall
        key: sfw-${{ runner.os }}-${{ runner.arch }}-${{ steps.select.outputs.version }}-${{ steps.select.outputs.digest }}

    - name: Install the pinned sfw CLI
      shell: bash
      env:
        SFW_VERSION: ${{ steps.select.outputs.version }}
        SFW_ASSET: ${{ steps.select.outputs.asset }}
        SFW_DIGEST: ${{ steps.select.outputs.digest }}
        SFW_NAME: ${{ steps.select.outputs.name }}
        SFW_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        set -euo pipefail
        directory="$RUNNER_TEMP/socket-firewall"
        mkdir -p "$directory"
        if [ "$SFW_CACHE_HIT" = "true" ] && [ -f "$directory/$SFW_NAME" ]; then
          echo "sfw cache hit: using the cached $SFW_ASSET ${SFW_VERSION}"
        else
          echo "sfw cache miss: downloading $SFW_ASSET ${SFW_VERSION}"
          # Without --retry-delay, curl waits 1, 2, 4, ... 128 seconds between
          # attempts: 255 seconds over 8 retries, about 5 minutes with the
          # attempts themselves. --retry-all-errors also retries HTTP 5xx
          # answers such as 504.
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --retry 8 --retry-all-errors \
            --output "$directory/$SFW_NAME" \
            "https://github.com/SocketDev/sfw-free/releases/download/v${SFW_VERSION}/${SFW_ASSET}"
        fi
        printf '%s  %s\n' "$SFW_DIGEST" "$directory/$SFW_NAME" > "$directory/sfw.sha256"
        if command -v sha256sum > /dev/null 2>&1; then
          sha256sum --check --status "$directory/sfw.sha256"
        else
          shasum --algorithm 256 --check --status "$directory/sfw.sha256"
        fi
        chmod +x "$directory/$SFW_NAME"
        rm -f "$directory/sfw.sha256"
        echo "$directory" >> "$GITHUB_PATH"
        # Ask sfw to print its banner and every package it checks, so the job
        # log shows what the firewall saw.
        echo "SFW_VERBOSE=true" >> "$GITHUB_ENV"
        echo "SFW_DEBUG=true" >> "$GITHUB_ENV"

    - name: Report the installed sfw version
      shell: bash
      run: sfw --version
