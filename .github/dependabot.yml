version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directories:
      - /
      - /packages/provenance
      - /packages/provenance-rules-js
      - /examples/typescript-sdk
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
