name: Profile API latency

# Read-only profiling of the slow local API calls (provenance-qoub.3 to .7).
# Runs the API latency harness under perf and strace on a release build that
# keeps symbols and frame pointers. No product code changes.
on:
  push:
    branches: [wip/profile-api-latency]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  profile:
    name: Profile (${{ matrix.pass }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        pass: [strace, perf]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-socket-firewall
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: profile-api-latency
          save-if: false
      - name: Build the release CLI with symbols and frame pointers
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          RUSTFLAGS: -C force-frame-pointers=yes
          CFLAGS: -fno-omit-frame-pointer
        run: |
          set -euo pipefail
          sfw cargo fetch --locked
          cargo build --locked --release -p provenance-cli --bin provenance
          target/release/provenance --version
          rustc --version
      - name: Install perf and strace
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q strace linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -q linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version; strace --version | head -1; uname -r; nproc; free -m
          grep -m1 'model name' /proc/cpuinfo
      - name: Run the pass
        env:
          PROF_READS: 3
        run: tools/profile/run.sh target/release/provenance prof "$RUNNER_TEMP/prof" ${{ matrix.pass }}
      - name: Convert
        if: always()
        run: |
          set -uo pipefail
          for data in prof/*.data; do
            [ -f "$data" ] || continue
            perf script --no-inline -i "$data" -F comm,pid,tid,time,event,ip,sym,dso --show-task-events 2>> prof/script.err | gzip > "${data%.data}.txt.gz"
          done
          for trace in prof/*.strace; do
            [ -f "$trace" ] && gzip "$trace"
          done
          if [ -f prof/results.json ]; then node tools/api-latency/report.mjs --input prof/results.json --out prof > /dev/null || true; fi
          if [ "${{ matrix.pass }}" = perf ]; then cp target/release/provenance prof/provenance; fi
          du -sh prof; ls prof | wc -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile-${{ matrix.pass }}
          path: prof
          if-no-files-found: ignore
