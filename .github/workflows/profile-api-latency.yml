name: Profile API latency

# Read-only profiling of the slow local API calls (provenance-qoub.3 to .7).
# Runs the API latency harness under perf and strace on a release build that
# keeps symbols and frame pointers. No product code changes.
on:
  push:
    branches: [wip/profile-api-latency]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-socket-firewall
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: profile-api-latency
          save-if: true
      - name: Build the release CLI with symbols and frame pointers
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          RUSTFLAGS: -C force-frame-pointers=yes
          CFLAGS: -fno-omit-frame-pointer
        run: |
          set -euo pipefail
          sfw cargo fetch --locked
          cargo build --locked --release -p provenance-cli --bin provenance
          target/release/provenance --version
          rustc --version
      - name: Install perf and strace
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q strace linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -q linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version; strace --version | head -1; uname -r; nproc; free -m; df -h . | tail -1
      - name: Run the passes
        run: tools/profile/run.sh target/release/provenance prof "$RUNNER_TEMP/prof" "${PASSES:-time strace perf}"
      - name: Analyze
        if: always()
        run: |
          set -uo pipefail
          git clone --depth 1 https://github.com/brendangregg/FlameGraph "$RUNNER_TEMP/FlameGraph"
          for dir in prof/perf/*/; do
            perf script -i "$dir/perf.data" -F comm,pid,tid,time,event,ip,sym,dso --show-task-events 2> "$dir/script.err" \
              | python3 tools/profile/perf_calls.py "$dir/calls.tsv" "$dir"
            rm -f "$dir/perf.data"
            for file in "$dir"/collapsed/*.main.txt; do
              [ -f "$file" ] || continue
              grep -v '^#' "$file" | "$RUNNER_TEMP/FlameGraph/flamegraph.pl" --countname us --title "$(head -1 "$file")" > "${file%.txt}.svg" || true
            done
          done
          for dir in prof/strace/*/; do
            python3 tools/profile/strace_calls.py "$dir/strace.txt.gz" "$dir/calls.tsv" "$dir/calls.json"
          done
          for dir in prof/time/*/; do
            node tools/api-latency/report.mjs --input "$dir/results.json" --out "$dir" > /dev/null || true
          done
          cp target/release/provenance prof/provenance
          du -sh prof/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile
          path: prof
          if-no-files-found: ignore
