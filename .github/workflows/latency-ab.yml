name: Latency A/B 616 618

# Temporary measurement workflow. One job builds the release CLI of main,
# PR 616 and PR 618, then runs the API latency harness from main against
# each binary in turn, interleaved, on clones of the main state.
on:
  push:
    branches: [wip/latency-ab-616-618]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  MAIN_SHA: 33386c06f3425ca0c89f181e823a904375a08c9e
  PR616_SHA: f2753054673b5197dddbb18f5fe10f6a900a7936
  PR618_SHA: 59a7589c488b389511248a62d140d82066a63cd8
  READS: 10
  WRITES: 5
  ROUNDS: 3

jobs:
  ab:
    name: Latency A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-socket-firewall
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: api-latency
          save-if: false
      - name: Build the three release CLIs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          for pair in main:$MAIN_SHA pr616:$PR616_SHA pr618:$PR618_SHA; do
            name=${pair%%:*}; sha=${pair#*:}
            src="$RUNNER_TEMP/src-$name"
            git worktree add --detach "$src" "$sha"
            ( cd "$src"
              sfw cargo fetch --locked
              if [ "$name" = main ]; then export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"; else export CARGO_TARGET_DIR="$RUNNER_TEMP/target-$name"; fi
              start=$(date +%s)
              cargo build --locked --release -p provenance-cli --bin provenance
              cp "$CARGO_TARGET_DIR/release/provenance" "$RUNNER_TEMP/bin/$name"
              echo "$name build $(( $(date +%s) - start )) s"
            )
            "$RUNNER_TEMP/bin/$name" --version
          done
          git -C "$RUNNER_TEMP/src-main" rev-parse HEAD
      - name: Time the calls, interleaved
        run: |
          set -uo pipefail
          mkdir -p ab
          for round in $(seq 1 "$ROUNDS"); do
            case $round in 1) order="main pr616 pr618";; 2) order="pr616 pr618 main";; *) order="pr618 main pr616";; esac
            for name in $order; do
              start=$(date +%s)
              rm -rf "$RUNNER_TEMP/work"
              if RUNNER_DESCRIPTION="$ImageOS $ImageVersion" node tools/api-latency/run.mjs \
                  --bin "$RUNNER_TEMP/bin/$name" --source "$RUNNER_TEMP/src-main" --work "$RUNNER_TEMP/work" \
                  --out "ab/$name-r$round.json" --reads "$READS" --writes "$WRITES" 2> "ab/$name-r$round.log"; then
                mkdir -p "ab/$name-r$round"
                node tools/api-latency/report.mjs --input "ab/$name-r$round.json" --out "ab/$name-r$round" > /dev/null
                echo "round $round $name ok $(( $(date +%s) - start )) s"
              else
                echo "round $round $name FAILED $(( $(date +%s) - start )) s"; tail -20 "ab/$name-r$round.log"
              fi
            done
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: latency-ab
          path: ab
          if-no-files-found: ignore
