name: Agent Cargo verification
run-name: Agent Cargo ${{ inputs.snapshot_sha || github.sha }}

on:
  push:
    branches:
      - agent-ci/**
  workflow_dispatch:
    inputs:
      snapshot_sha:
        description: Exact commit to verify
        required: true
        type: string
      command_json:
        description: Optional JSON Cargo argv for a package-specific check
        required: false
        default: ""
        type: string
      command_key:
        description: Stable command identity for concurrency
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent-cargo-${{ github.event_name == 'push' && github.ref || inputs.snapshot_sha }}-${{ inputs.command_key }}
  cancel-in-progress: false

jobs:
  # A snapshot branch is public when the shim pushes it. This job scans the
  # commits of the snapshot that main does not contain, with the gitleaks
  # config of main. A finding fails the run, and the shim reports it.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Validate commit ID
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
        run: |
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
          fetch-depth: 0
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          # From gitleaks_8.24.3_checksums.txt of the same release.
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan commits
        shell: bash
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
          git show refs/remotes/origin/main:.gitleaks.toml > "$RUNNER_TEMP/gitleaks.toml"
          log_opts="--diff-merges=first-parent $SNAPSHOT_SHA --not origin/main"
          echo "gitleaks log options: $log_opts"
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --exit-code 1 \
            --config "$RUNNER_TEMP/gitleaks.toml" --log-opts="$log_opts"

  build:
    name: Build
    if: (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/agent-ci/build/') || startsWith(github.ref, 'refs/heads/agent-ci/build-artifact/'))) || (github.event_name == 'workflow_dispatch' && inputs.command_json == '' && inputs.command_key == 'build')
    runs-on: ubuntu-24.04
    steps:
      - name: Validate commit ID
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
        run: |
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
      - name: Confirm exact commit
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
        run: test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          prefix-key: v1
          shared-key: build-cli
          add-job-id-key: "false"
          save-if: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix tools/operation-codegen
      - run: node tools/operation-codegen/ensure-generated.mjs
      - run: cargo build --workspace --all-features
      - name: Upload dev binary
        if: startsWith(github.ref, 'refs/heads/agent-ci/build-artifact/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-dev-${{ github.sha }}
          path: target/debug/provenance
          if-no-files-found: error
          retention-days: 3

  check:
    name: Check
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent-ci/check/')) || (github.event_name == 'workflow_dispatch' && inputs.command_json == '' && inputs.command_key == 'check')
    runs-on: ubuntu-24.04
    steps:
      - name: Validate commit ID
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
        run: |
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
      - name: Confirm exact commit
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
        run: test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          prefix-key: v1
          shared-key: rust
          add-job-id-key: "false"
          save-if: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix tools/operation-codegen
      - run: node tools/operation-codegen/ensure-generated.mjs
      - run: cargo check --workspace --all-targets

  clippy:
    name: Clippy
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent-ci/clippy/')) || (github.event_name == 'workflow_dispatch' && inputs.command_json == '' && inputs.command_key == 'clippy')
    runs-on: ubuntu-24.04
    steps:
      - name: Validate commit ID
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
        run: |
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
      - name: Confirm exact commit
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
        run: test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          prefix-key: v1
          shared-key: clippy
          add-job-id-key: "false"
          save-if: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix tools/operation-codegen
      - run: node tools/operation-codegen/ensure-generated.mjs
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent-ci/test/')) || (github.event_name == 'workflow_dispatch' && inputs.command_json == '' && inputs.command_key == 'test')
    runs-on: ubuntu-24.04
    steps:
      - name: Validate commit ID
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
        run: |
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
      - name: Confirm exact commit
        env:
          SNAPSHOT_SHA: ${{ github.event_name == 'push' && github.sha || inputs.snapshot_sha }}
        run: test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          prefix-key: v1
          shared-key: rust
          add-job-id-key: "false"
          save-if: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix tools/operation-codegen
      - run: node tools/operation-codegen/ensure-generated.mjs
      - run: cargo test --workspace --all-features --no-fail-fast

  command:
    name: Command
    if: inputs.command_json != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Validate commit ID
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        run: |
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.snapshot_sha }}
      - name: Confirm exact commit
        env:
          SNAPSHOT_SHA: ${{ inputs.snapshot_sha }}
        run: test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          prefix-key: v1
          shared-key: rust
          add-job-id-key: "false"
          save-if: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix tools/operation-codegen
      - run: node tools/operation-codegen/ensure-generated.mjs
      - name: Run requested Cargo check
        env:
          CARGO_ARGS_JSON: ${{ inputs.command_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          args = json.loads(os.environ["CARGO_ARGS_JSON"])
          allowed = {"build", "check", "clippy", "test"}
          if not isinstance(args, list) or not args or args[0] not in allowed:
              sys.exit("Unsupported Cargo command")
          if not all(isinstance(arg, str) and "\x00" not in arg for arg in args):
              sys.exit("Invalid Cargo argument")
          sys.exit(subprocess.call(["cargo", *args]))
          PY
