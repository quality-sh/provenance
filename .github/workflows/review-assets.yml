name: Compose review assets

on:
  workflow_call:
    inputs:
      timeout-minutes:
        type: number
        default: 20
        required: false

permissions:
  contents: read

jobs:
  compose:
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-socket-firewall
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: operation-generated
          path: target/operation-artifact
      - run: tar -xzf target/operation-artifact/operation-generated.tar.gz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - run: sfw npm ci --prefix tools/operation-codegen
      - run: sfw npm ci --prefix tools/review-host
      - run: sfw npm ci --prefix packages/provenance
      - run: npm run build --prefix packages/provenance
      - name: Compose the pinned renderer and host
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/review-host/prepare.ts crates/provenance-cli/review-assets-generated
      - run: node --test tools/review-host/*.test.ts
      - name: Check Cargo asset inclusion
        run: |
          cargo package --locked --allow-dirty -p provenance-cli --list > target/review-package-files
          node --input-type=module <<'JS'
          import { readFileSync, readdirSync } from 'node:fs';
          const listed = new Set(readFileSync('target/review-package-files', 'utf8').split('\n'));
          for (const file of readdirSync('crates/provenance-cli/review-assets-generated', { recursive: true, withFileTypes: true })) {
            if (!file.isFile()) continue;
            const name = `${file.parentPath}/${file.name}`.replace('crates/provenance-cli/', '');
            if (!listed.has(name)) throw new Error(`Cargo package omits ${name}`);
          }
          JS
      - name: Archive composed assets and the matching SDK for native checks
        run: |
          mkdir -p target/review-sdk/dist target/review-artifact
          cp -rf packages/provenance/dist/. target/review-sdk/dist/
          cp -f packages/provenance/package.json target/review-sdk/
          tar -czf target/review-artifact/review-composed.tar.gz crates/provenance-cli/review-assets-generated target/review-sdk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-composed
          path: target/review-artifact/review-composed.tar.gz
          if-no-files-found: error
          retention-days: 30
