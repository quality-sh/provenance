name: Socket

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "packages/**"
      - "examples/typescript-sdk/package.json"
      - "examples/typescript-sdk/package-lock.json"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  socket:
    name: Socket dependency scan
    runs-on: ubuntu-latest
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Explain a missing API key
        if: env.SOCKET_SECURITY_API_KEY == ''
        run: |
          echo "::warning::SOCKET_SECURITY_API_KEY is not set. Create a key in the" \
            "Socket dashboard (socket.dev) and add it as a repository secret to" \
            "enable this scan."
      - uses: actions/setup-python@v7
        if: env.SOCKET_SECURITY_API_KEY != ''
        with:
          python-version: "3.12"
      - name: Install Socket CLI
        if: env.SOCKET_SECURITY_API_KEY != ''
        run: pip install socketsecurity --upgrade
      - name: Run Socket security scan
        if: env.SOCKET_SECURITY_API_KEY != ''
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          socketcli \
            --target-path "$GITHUB_WORKSPACE" \
            --scm github \
            --pr-number "${{ github.event.pull_request.number }}"
