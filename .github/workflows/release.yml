name: Release

on:
  # Manual runs build and package artifacts without publication.
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  preflight:
    name: Verify release contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
      npm-channel: ${{ steps.contract.outputs.npm-channel }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      build-matrix: ${{ steps.contract.outputs.build-matrix }}
      smoke-matrix: ${{ steps.contract.outputs.smoke-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-socket-firewall
      # Releases are cut from main, and main merges run the full platform
      # matrix. Refuse to build unless that run finished green on this exact
      # commit, so a red platform leg cannot ship unnoticed.
      - name: Gate the release on a green CI run
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 1800))
          while :; do
            run=$(gh api "repos/$GH_REPO/actions/runs?head_sha=$SHA&event=push" \
              --jq '[.workflow_runs[] | select(.name == "CI")][0] // empty')
            if [[ -n "$run" ]]; then
              conclusion=$(jq -r '.conclusion // "running"' <<<"$run")
              url=$(jq -r '.html_url' <<<"$run")
              echo "CI run for $SHA: $conclusion ($url)"
              case "$conclusion" in
                success) exit 0 ;;
                running | queued) ;;
                *) echo "::error::CI is not green on the release commit; refusing to release." ; exit 1 ;;
              esac
            else
              echo "No CI run found for $SHA yet."
            fi
            (( SECONDS < deadline )) || { echo "::error::timed out waiting for CI."; exit 1; }
            sleep 30
          done
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      # The release version check reads full Cargo metadata for the Rust
      # SDK example, and generate.mjs builds the codegen crate. Fetch both
      # lockfiles through the firewall first.
      - name: Fetch crates through Socket Firewall
        run: |
          sfw cargo fetch --locked
          sfw cargo fetch --locked --manifest-path examples/rust-sdk/Cargo.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Verify versions and load release targets
        id: contract
        shell: bash
        run: |
          node packages/provenance/scripts/generate-release-consumers.js --runtime-only
          node packages/provenance/scripts/generate-release-consumers.js --check
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version=$(node -p "require('./packages/provenance/package.json').version")
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          source .github/scripts/release-smoke/lib.sh
          validate_version "$version"
          bash .github/scripts/verify-release-versions.sh "v$version"
          python3 .github/scripts/release-contract.py \
            "$version" .github/release-targets.json >> "$GITHUB_OUTPUT"

      - run: sfw npm ci --prefix tools/operation-codegen
      - run: node tools/operation-codegen/generate.mjs
      - name: Archive generated release source
        run: |
          mkdir -p target/operation-artifact
          tar -czf target/operation-artifact/operation-generated.tar.gz contracts/operations packages/provenance/src/generated crates/provenance-http-client/src/generated
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operation-generated
          path: target/operation-artifact/operation-generated.tar.gz
          retention-days: 1

  review-assets:
    needs: preflight
    uses: ./.github/workflows/review-assets.yml

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [preflight, review-assets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-socket-firewall
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-composed
          path: target/review-artifact
      - name: Restore composed review assets
        shell: bash
        run: tar -xzf target/review-artifact/review-composed.tar.gz
      - name: Fetch crates through Socket Firewall
        env:
          # Cargo on Windows checks certificate revocation with schannel, and
          # the revocation status of the firewall's intercepted TLS chain is
          # unknown. Cargo documents http.check-revoke for a proxy that
          # intercepts TLS. Only this firewalled fetch turns the check off.
          CARGO_HTTP_CHECK_REVOKE: ${{ runner.os == 'Windows' && 'false' || 'true' }}
        run: sfw cargo fetch --locked
      - run: cargo build --release -p provenance-cli --features scanner --target ${{ matrix.target }} --timings
      - name: The release binary must reject the development command
        shell: bash
        run: python .github/scripts/verify-release-commands.py "target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          package="${{ matrix.package }}"
          mkdir -p "dist/${package}"
          cp -f "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${package}/"
          cp -f "target/${{ matrix.target }}/release/cargo-provenance${{ matrix.executable_suffix }}" "dist/${package}/"
          cp -f README.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${{ matrix.archive_name }}" "${package}"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $package = "${{ matrix.package }}"
          New-Item -ItemType Directory -Force "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$package/${{ matrix.binary }}"
          Copy-Item "target/${{ matrix.target }}/release/cargo-provenance${{ matrix.executable_suffix }}" "dist/$package/cargo-provenance${{ matrix.executable_suffix }}"
          Copy-Item README.md, LICENSE "dist/$package/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/${{ matrix.archive_name }}" -Force

      - name: Package npm engine
        shell: bash
        run: |
          version="${{ needs.preflight.outputs.version }}"
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          package="dist/npm-${{ matrix.target }}"
          node packages/provenance/scripts/package-engine.js \
            --targets .github/release-targets.json \
            --target "${{ matrix.target }}" \
            --binary "$binary" \
            --out "$package" \
            --version "$version"
          npm pack "./$package" --pack-destination dist

      - name: Verify native archive and npm engine contents
        shell: bash
        run: |
          mkdir -p target/review-native target/review-engine
          python .github/scripts/release-smoke/extract_archive.py "dist/${{ matrix.archive_name }}" target/review-native
          tar -xzf dist/quality-sh-provenance-*.tgz -C target/review-engine
          native=$(find target/review-native -type f -name '${{ matrix.binary }}' -print -quit)
          engine=$(find target/review-engine -type f -name '${{ matrix.binary }}' -print -quit)
          test -n "$native" && test -n "$engine"
          node tools/review-host/verify-native.ts "$native" crates/provenance-cli/review-assets-generated target/review-sdk
          node tools/review-host/verify-native.ts "$engine" crates/provenance-cli/review-assets-generated target/review-sdk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.archive_name }}
            dist/quality-sh-provenance-*.tgz
          if-no-files-found: error

      - name: Save Cargo timing reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings-release-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: github.event_name == 'push'
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - publish-crates
      - publish-npm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum provenance-* quality-sh-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/provenance-*
            dist/quality-sh-provenance-*.tgz
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ fromJSON(needs.preflight.outputs.prerelease) }}

  publish-crates:
    if: github.event_name == 'push'
    name: Publish Rust crates
    runs-on: ubuntu-24.04
    needs:
      - preflight
      - build
      - review-assets
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-socket-firewall
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: operation-generated
          path: target/operation-artifact
      - name: Restore generated operation source
        shell: bash
        run: tar -xzf target/operation-artifact/operation-generated.tar.gz
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-composed
          path: target/review-artifact
      - name: Restore composed review assets
        shell: bash
        run: tar -xzf target/review-artifact/review-composed.tar.gz
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          # Cargo generates the archive checksum. Keep this version fixed so
          # a later rerun can compare the same bytes with crates.io.
          toolchain: 1.98.0
      - name: Fetch crates through Socket Firewall
        run: sfw cargo fetch --locked
      - name: Verify packaged Rust workspace
        shell: bash
        run: |
          git diff --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          cargo package --workspace --locked --allow-dirty --registry crates-io
      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish Rust workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          for crate_name in \
            provenance-macros \
            provenance-core \
            provenance-porcelain \
            provenance-scanner \
            provenance-ste100 \
            provenance-store \
            provenance-report \
            provenance-sdk \
            provenance-http-client \
            provenance-transport \
            provenance-cli
          do
            bash .github/scripts/publish-cargo-if-missing.sh \
              "$crate_name" "$RELEASE_VERSION" \
              "target/package/${crate_name}-${RELEASE_VERSION}.crate"
          done

  publish-npm:
    if: github.event_name == 'push'
    name: Publish npm packages
    # npm provenance rejects the self-hosted identity of third-party runners.
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-socket-firewall
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: operation-generated
          path: target/operation-artifact
      - name: Restore generated operation source
        shell: bash
        run: tar -xzf target/operation-artifact/operation-generated.tar.gz
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: sfw npm install --global npm@^11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish platform engines
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          NPM_TAG: ${{ needs.preflight.outputs.npm-channel }}
        run: |
          for package in ./dist/quality-sh-provenance-*.tgz; do
            package_name=$(tar -xOzf "$package" package/package.json | jq -er '.name')
            bash .github/scripts/publish-npm-if-missing.sh \
              "$package_name" "$RELEASE_VERSION" "$package" "$NPM_TAG"
          done
      - name: Pack TypeScript SDK
        run: |
          sfw npm ci --prefix packages/provenance
          npm pack ./packages/provenance --pack-destination dist
      - name: Publish TypeScript SDK
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          NPM_TAG: ${{ needs.preflight.outputs.npm-channel }}
        run: |
          bash .github/scripts/publish-npm-if-missing.sh \
            "@quality-sh/provenance" "$RELEASE_VERSION" \
            "./dist/quality-sh-provenance-${RELEASE_VERSION}.tgz" "$NPM_TAG"
      - name: Pack initializer
        run: npm pack ./packages/create-provenance --pack-destination dist
      - name: Publish initializer
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          NPM_TAG: ${{ needs.preflight.outputs.npm-channel }}
        run: |
          bash .github/scripts/publish-npm-if-missing.sh \
            "@quality-sh/create-provenance" "$RELEASE_VERSION" \
            "./dist/quality-sh-create-provenance-${RELEASE_VERSION}.tgz" "$NPM_TAG"

  smoke:
    if: github.event_name == 'push'
    name: Verify released installations
    needs:
      - preflight
      - publish
    permissions:
      contents: read
    uses: ./.github/workflows/release-smoke.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      archive_matrix: ${{ needs.preflight.outputs.smoke-matrix }}
