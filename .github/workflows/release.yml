name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release -p provenance-cli --all-features --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          package="provenance-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/provenance" "dist/${package}/"
          cp README.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $package = "provenance-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/provenance.exe" "dist/$package/provenance.exe"
          Copy-Item README.md, LICENSE "dist/$package/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip" -Force

      - name: Package npm engine
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary="target/${{ matrix.target }}/release/provenance"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            binary="${binary}.exe"
          fi
          package="dist/npm-${{ matrix.target }}"
          node packages/provenance/scripts/package-engine.js \
            --target "${{ matrix.target }}" \
            --binary "$binary" \
            --out "$package" \
            --version "$version"
          npm pack "./$package" --pack-destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: provenance-${{ github.ref_name }}-${{ matrix.target }}
          path: |
            dist/provenance-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
            dist/quality-sh-provenance-*.tgz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum provenance-* quality-sh-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/provenance-*
            dist/quality-sh-provenance-*.tgz
            dist/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: build
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify release versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          npm_version=$(node -p "require('./packages/provenance/package.json').version")
          test "$version" = "$cargo_version"
          test "$version" = "$npm_version"
      - name: Publish platform engines
        # The npm token is scoped to the publish steps so dependency install
        # scripts elsewhere in the job can never read it.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm_tag=latest
          if [[ "$version" == *-* ]]; then npm_tag=next; fi
          for package in ./dist/quality-sh-provenance-*.tgz; do
            npm publish "$package" --access public --provenance --tag "$npm_tag"
          done
      - name: Pack TypeScript SDK
        run: |
          npm ci --prefix packages/provenance
          npm pack ./packages/provenance --pack-destination dist
      - name: Publish TypeScript SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm_tag=latest
          if [[ "$version" == *-* ]]; then npm_tag=next; fi
          npm publish "./dist/quality-sh-provenance-${version}.tgz" \
            --access public --provenance --tag "$npm_tag"
