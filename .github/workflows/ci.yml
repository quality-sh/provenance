name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Required checks skipped via `if:` count as passed for the main ruleset,
  # so jobs whose inputs are untouched can skip without renaming anything.
  # Pushes to main always run every job; the filters only narrow PRs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      sdk: ${{ steps.filter.outputs.sdk }}
      wiki: ${{ steps.filter.outputs.wiki }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
            rust:
              - *ci
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
            sdk:
              - *ci
              - "packages/**"
              - "examples/typescript-sdk/**"
            wiki:
              - *ci
              - "tests/**"
              - "package.json"
              - "package-lock.json"
              - "crates/provenance-cli/src/wiki/**"

  fmt:
    name: Format
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test --workspace --all-features --no-fail-fast

  rule-coverage:
    name: Rule Coverage
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      # Report-only for now: the report is printed but the step never fails.
      # The four wiki homepage rules are bound and verified. --strict still
      # cannot be added because the scan flags ~66 directive-shaped fixture
      # strings inside coverage and scanner tests (unknown rule ids, legacy
      # @statesman markers). Add --strict once those fixtures are excluded
      # from the scan or rewritten so the parser skips them.
      - run: cargo run -p provenance-cli -- coverage scan --repo . --path crates --scope default --validate-rules

  wiki-dom:
    name: Wiki DOM
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.wiki == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:dom

  typescript-sdk:
    name: TypeScript SDK POC
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: cargo build -p provenance-cli
      - run: npm ci --prefix packages/provenance
      - run: npm test --prefix packages/provenance
      # Bun eliminates the calling frame of a tail call, so a verify call that
      # states no file only reproduces here.
      - run: npm run test:bun --prefix packages/provenance
      - run: npm ci --prefix packages/provenance-rules-js
      - run: npm test --prefix packages/provenance-rules-js
      - run: npm ci --prefix examples/typescript-sdk
      - name: Run packaged fixture
        shell: bash
        run: |
          fixture_repo="$PWD/examples/typescript-sdk"
          target/debug/provenance init --path "$fixture_repo" --scope default --path-prefix .
          PROVENANCE_BIN="$PWD/target/debug/provenance" \
          PROVENANCE_REPO="$fixture_repo" \
          PROVENANCE_SPEC_OWNER="spec://typescript/share-links" \
          PROVENANCE_VERIFICATION_OWNER="ci://typescript-example" \
          npm test --prefix examples/typescript-sdk
          rule_id=$(target/debug/provenance rules list \
            --repo "$fixture_repo" --scope default --format json \
            | jq -er 'select(length == 1) | .[0].id')
          target/debug/provenance rules show \
            --repo "$fixture_repo" --scope default --id "$rule_id" --format json
          target/debug/provenance sdk verification-runs \
            --repo "$fixture_repo" --scope default --rule "$rule_id" --format json \
            | jq -e 'length == 1 and .[0].status == "passed"'
          target/debug/provenance sdk verification-bindings \
            --repo "$fixture_repo" --scope default --rule "$rule_id" --format json \
            | jq -e 'length == 1 and .[0].file == "dist/share-links.test.js"'

  typescript-sdk-packed-install:
    name: Packaged SDK install (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build -p provenance-cli
      - run: npm ci --prefix packages/provenance
      - run: npm run build --prefix packages/provenance
      - run: npm run test:packed --prefix packages/provenance
