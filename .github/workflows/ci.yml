name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Apply the same debug setting to temporary Cargo workspaces used by tests.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Required checks skipped via `if:` count as passed for the main ruleset,
  # so jobs whose inputs are untouched can skip without renaming anything.
  # Main pushes and manual runs execute every job; filters only narrow PRs.
  changes:
    name: Detect changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      sdk: ${{ steps.filter.outputs.sdk }}
      contract: ${{ steps.filter.outputs.contract }}
      release: ${{ steps.filter.outputs.release }}
      test-matrix: ${{ steps.matrices.outputs.test }}
      file-access-matrix: ${{ steps.matrices.outputs.file_access }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
            release: &release
              - *ci
              - ".gitattributes"
              - ".github/release-targets.json"
              - ".github/workflows/release.yml"
              - ".github/workflows/review-assets.yml"
              - "tools/review-host/**"
              - "tools/review-assets.json"
              - ".github/workflows/release-smoke.yml"
              - ".github/scripts/**/*.sh"
              - ".github/scripts/**/*.py"
            rust:
              - *ci
              - *release
              - ".github/scripts/publish-cargo-if-missing.sh"
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".config/nextest.toml"
              - "examples/rust-sdk/**"
              # Skill files are Rust inputs: the sources compile into the
              # binary with include_str!, and a test compares the installed
              # copies against what an install writes.
              - "skills/**"
              - ".agents/skills/**"
              - ".claude/skills/**"
            contract:
              - *ci
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "tools/operation-codegen/**"
              - "contracts/operations/**"
              - "packages/provenance/**"
            sdk:
              - "crates/provenance-core/**"
              - "crates/provenance-ste100/**"
              - "crates/provenance-store/**"
              - "tools/operation-codegen/**"
              - "contracts/operations/**"
              - *ci
              - "packages/**"
              - "examples/typescript-sdk/**"
      # Pull requests run the Test job on Linux only; other events add the
      # windows/macos legs. The packed-install matrix stays static on every
      # event: release_onboarding_structure.rs pins it to release-targets.json.
      - name: Select platform matrices for the event
        id: matrices
        run: |
          echo "file_access=$(jq -c '{include: map({os: .smoke_os, target: .target})}' .github/release-targets.json)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo 'test={"os":["ubuntu-latest"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'test={"os":["ubuntu-latest","macos-latest","windows-latest"]}' >> "$GITHUB_OUTPUT"
          fi

  generate-operations:
    name: Generate operation clients
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1
          shared-key: operation-codegen
          add-job-id-key: "false"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --prefix tools/operation-codegen
      - run: node tools/operation-codegen/check-source-control.mjs
      - run: node tools/operation-codegen/generate.mjs
      - name: Archive generated source for dependent jobs
        run: |
          mkdir -p target/operation-artifact
          tar -czf target/operation-artifact/operation-generated.tar.gz contracts/operations packages/provenance/src/generated crates/provenance-http-client/src/generated
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operation-generated
          path: target/operation-artifact/operation-generated.tar.gz
          retention-days: 1

  review-assets:
    needs: [changes, generate-operations]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    uses: ./.github/workflows/review-assets.yml

  # One build per OS. Every job that only needs to drive the CLI downloads
  # this artifact instead of compiling the workspace itself; cargo test and
  # clippy still build their own profiles. The linux build is its own job so
  # the linux-only consumers do not wait on the platform builds; the packed
  # matrix needs both.
  build-cli-linux:
    name: Build provenance-cli (linux)
    needs: [changes, review-assets]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1
          shared-key: build-cli
          add-job-id-key: "false"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-composed
          path: target/review-artifact
      - name: Restore composed review assets
        shell: bash
        run: tar -xzf target/review-artifact/review-composed.tar.gz
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build --locked -p provenance-cli -p provenance-transport --features provenance-transport/test-fixture --bins --timings
      - name: Verify embedded review assets and SDK reads
        run: node tools/review-host/verify-native.ts target/debug/provenance crates/provenance-cli/review-assets-generated target/review-sdk
      - name: Upload the CLI and isolated test host for the consumer jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-cli-x86_64-unknown-linux-gnu
          path: |
            target/debug/provenance
            target/debug/existing-root-host-fixture
          retention-days: 1
      - name: Save Cargo timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-build-cli-linux
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 30

  build-cli-platforms:
    name: Build provenance-cli (${{ matrix.target }})
    needs: [changes, review-assets]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            binary: provenance.exe
            fixture: existing-root-host-fixture.exe
          - os: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            binary: provenance
            fixture: existing-root-host-fixture
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1
          shared-key: build-cli
          add-job-id-key: "false"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-composed
          path: target/review-artifact
      - name: Restore composed review assets
        shell: bash
        run: tar -xzf target/review-artifact/review-composed.tar.gz
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build --locked -p provenance-cli -p provenance-transport --features provenance-transport/test-fixture --bins --timings
      - name: Verify embedded review assets and SDK reads
        run: node tools/review-host/verify-native.ts target/debug/${{ matrix.binary }} crates/provenance-cli/review-assets-generated target/review-sdk
      - name: Upload the CLI and isolated test host for the consumer jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-cli-${{ matrix.target }}
          path: |
            target/debug/${{ matrix.binary }}
            target/debug/${{ matrix.fixture }}
          retention-days: 1
      - name: Save Cargo timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-build-cli-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 30

  fmt:
    name: Format
    needs: [changes, generate-operations]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operation-generated
          path: target/operation-artifact
      - name: Restore generated operation source
        shell: bash
        run: tar -xzf target/operation-artifact/operation-generated.tar.gz
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: [changes, generate-operations]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operation-generated
          path: target/operation-artifact
      - name: Restore generated operation source
        shell: bash
        run: tar -xzf target/operation-artifact/operation-generated.tar.gz
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      # Own cache key: clippy saves check-profile artifacts, and the first
      # saver owns a key, so sharing would hand build jobs a useless cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1
          shared-key: clippy
          add-job-id-key: "false"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --timings -- -D warnings
      - name: Save Cargo timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-clippy
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 30

  test:
    name: Test (${{ matrix.os }})
    needs: [changes, generate-operations]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.contract == 'true'
    runs-on: ${{ fromJSON('{"ubuntu-latest":"blacksmith-8vcpu-ubuntu-2404","macos-latest":"blacksmith-12vcpu-macos-latest","windows-latest":"blacksmith-8vcpu-windows-2025"}')[matrix.os] }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operation-generated
          path: target/operation-artifact
      - name: Restore generated operation source
        shell: bash
        run: tar -xzf target/operation-artifact/operation-generated.tar.gz
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1
          shared-key: test-all-features
          add-job-id-key: "false"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: nextest@0.9.143
      - name: Test concurrently
        run: cargo nextest run --profile ci --workspace --all-features --no-fail-fast --cargo-profile test --timings
      - name: Test documentation
        run: cargo test --workspace --all-features --doc --no-fail-fast
      - name: Save Cargo timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-test-${{ matrix.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 30

  # Default-features lane: runs the dogfood absence tests, which assert the
  # dev-only command does not exist in feature-less builds.
  test-default-features:
    name: Default-features CLI test
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1
          shared-key: test-default-features
          add-job-id-key: "false"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p provenance-cli --no-fail-fast --timings
      - name: Save Cargo timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-test-default-features
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 30

  rule-coverage:
    name: Rule Coverage
    needs: [changes, build-cli-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-cli-x86_64-unknown-linux-gnu
          path: target/debug
      - run: chmod +x target/debug/provenance target/debug/existing-root-host-fixture
      - run: target/debug/provenance coverage scan --repo . --path crates --scope default --validate-rules --strict
      - name: Validate initializer Rule bindings
        run: target/debug/provenance coverage scan --repo . --path packages/create-provenance --scope default --validate-rules --strict

  rust-sdk:
    name: Rust SDK example
    needs: [changes, build-cli-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-cli-x86_64-unknown-linux-gnu
          path: target/debug
      - run: chmod +x target/debug/provenance target/debug/existing-root-host-fixture
      - name: Run Rust fixture
        shell: bash
        run: |
          fixture_repo="$PWD/examples/rust-sdk"
          target/debug/provenance init --path "$fixture_repo" --scope default --path-prefix .
          (cd examples/rust-sdk && PROVENANCE_REPO="$fixture_repo" cargo run --bin apply)
          (cd examples/rust-sdk && \
            PROVENANCE_REPO="$fixture_repo" \
            PROVENANCE_VERIFICATION_OWNER="ci://rust-example" \
            cargo test)
          rule_id=$(target/debug/provenance rules list \
            --repo "$fixture_repo" --scope default --format json \
            | jq -er 'select(length == 1) | .[0].id')
          target/debug/provenance rules show \
            --repo "$fixture_repo" --scope default --id "$rule_id" --format json
          target/debug/provenance sdk verification-runs \
            --repo "$fixture_repo" --scope default --rule "$rule_id" --format json \
            | jq -e 'length == 1 and .[0].status == "passed"'
          target/debug/provenance sdk verification-bindings \
            --repo "$fixture_repo" --scope default --rule "$rule_id" --format json \
            | jq -e 'length == 1 and .[0].file == "tests/share_links.rs"'

  typescript-sdk:
    name: TypeScript SDK
    needs: [changes, generate-operations, build-cli-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operation-generated
          path: target/operation-artifact
      - name: Restore generated operation source
        shell: bash
        run: tar -xzf target/operation-artifact/operation-generated.tar.gz
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/provenance/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-cli-x86_64-unknown-linux-gnu
          path: target/debug
      - run: chmod +x target/debug/provenance target/debug/existing-root-host-fixture
      - run: npm ci --no-audit --no-fund --prefix packages/provenance
      - run: npm test --prefix packages/provenance
      # Bun eliminates the calling frame of a tail call, so a verify call that
      # states no file only reproduces here.
      - run: npm run test:bun --prefix packages/provenance

  typescript-sdk-example:
    name: TypeScript SDK example
    needs: [changes, generate-operations, build-cli-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operation-generated
          path: target/operation-artifact
      - name: Restore generated operation source
        shell: bash
        run: tar -xzf target/operation-artifact/operation-generated.tar.gz
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/provenance/package-lock.json
            examples/typescript-sdk/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-cli-x86_64-unknown-linux-gnu
          path: target/debug
      - run: chmod +x target/debug/provenance target/debug/existing-root-host-fixture
      - run: npm ci --no-audit --no-fund --prefix packages/provenance
      - run: npm run build --prefix packages/provenance
      - run: npm ci --no-audit --no-fund --prefix examples/typescript-sdk
      - name: Run packaged fixture
        shell: bash
        run: |
          fixture_repo="$PWD/examples/typescript-sdk"
          target/debug/provenance init --path "$fixture_repo" --scope default --path-prefix .
          PROVENANCE_SPEC_OWNER="spec://typescript/share-links" \
          PROVENANCE_VERIFICATION_OWNER="ci://typescript-example" \
          npm test --prefix examples/typescript-sdk
          rule_id=$(target/debug/provenance rules list \
            --repo "$fixture_repo" --scope default --format json \
            | jq -er 'select(length == 1) | .[0].id')
          target/debug/provenance rules show \
            --repo "$fixture_repo" --scope default --id "$rule_id" --format json
          target/debug/provenance sdk verification-runs \
            --repo "$fixture_repo" --scope default --rule "$rule_id" --format json \
            | jq -e 'length == 1 and .[0].status == "passed"'
          target/debug/provenance sdk verification-bindings \
            --repo "$fixture_repo" --scope default --rule "$rule_id" --format json \
            | jq -e 'length == 1 and .[0].file == "dist/share-links.test.js"'

  # One job, six managers: each smoke is seconds long, and six matrix legs
  # cost six runners to save one check row.
  initializer:
    name: Initializer
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.sdk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/create-provenance/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.3
      - uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.7.5
      - name: Enable Corepack package managers
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          corepack prepare yarn@4.9.2 --activate
      - run: npm ci --no-audit --no-fund --prefix packages/create-provenance
      - run: npm test --prefix packages/create-provenance
      - name: Package-manager smoke tests
        run: |
          for manager in npm bun deno pnpm yarn nub; do
            echo "== smoke test: $manager =="
            PROVENANCE_TEST_PACKAGE_MANAGER="$manager" \
              npm run test:manager-smoke --prefix packages/create-provenance
          done

  typescript-sdk-packed-install:
    name: Packaged SDK install (${{ matrix.target }})
    needs: [changes, generate-operations, build-cli-linux, build-cli-platforms]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            yarn-pnp: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            yarn-pnp: false
          - os: macos-15
            target: aarch64-apple-darwin
            yarn-pnp: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operation-generated
          path: target/operation-artifact
      - name: Restore generated operation source
        shell: bash
        run: tar -xzf target/operation-artifact/operation-generated.tar.gz
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/provenance/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-cli-${{ matrix.target }}
          path: target/debug
      - run: chmod +x target/debug/provenance target/debug/existing-root-host-fixture
        if: runner.os != 'Windows'
      - name: Enable Yarn Plug'n'Play test
        if: matrix.yarn-pnp
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
      - run: npm ci --no-audit --no-fund --prefix packages/provenance
      - run: npm run build --prefix packages/provenance
      - run: npm run test:packed --prefix packages/provenance
        env:
          PROVENANCE_TEST_YARN_PNP: ${{ matrix.yarn-pnp }}

  release-smoke-tools:
    name: Release tools (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-15
          - blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Parse release shell scripts
        shell: bash
        run: bash -n .github/scripts/*.sh .github/scripts/release-smoke/*.sh
      - name: Verify archive extraction tool
        shell: bash
        run: |
          source .github/scripts/release-smoke/lib.sh
          temporary=$(make_smoke_directory release-tar)
          trap 'rm -rf -- "$temporary"' EXIT
          mkdir -p "$temporary/source" "$temporary/extracted"
          printf 'archive fixture\n' > "$temporary/source/file.txt"
          if [[ "$RUNNER_OS" == Windows ]]; then
            archive="$temporary/fixture.zip"
          else
            archive="$temporary/fixture.tar.gz"
          fi
          python - "$temporary/source/file.txt" "$archive" <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          archive = Path(sys.argv[2])
          if archive.suffix == ".zip":
              with zipfile.ZipFile(archive, "w") as contents:
                  contents.write(source, "file.txt")
          else:
              with tarfile.open(archive, "w:gz") as contents:
                  contents.add(source, "file.txt")
          PY
          python .github/scripts/release-smoke/extract_archive.py \
            "$archive" "$temporary/extracted"
          cmp "$temporary/source/file.txt" "$temporary/extracted/file.txt"
      - name: Run ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck .github/scripts/*.sh .github/scripts/release-smoke/*.sh
      - name: Install workflow validator
        if: runner.os == 'Linux'
        env:
          GOBIN: ${{ runner.temp }}/release-tools
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows
        if: runner.os == 'Linux'
        env:
          GOBIN: ${{ runner.temp }}/release-tools
        run: '"$GOBIN/actionlint"'
      - name: Test release smoke helpers
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/release-smoke/test.sh

  operation-contract:
    name: Operation contract
    needs: [changes, generate-operations]
    if: github.event_name != 'pull_request' || needs.changes.outputs.contract == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: operation-generated
          path: target/operation-artifact
      - name: Restore generated operation source
        shell: bash
        run: tar -xzf target/operation-artifact/operation-generated.tar.gz
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: v1
          shared-key: operation-contract
          add-job-id-key: "false"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci --prefix tools/operation-codegen
      - run: node tools/operation-codegen/generate.mjs --check
      - run: npm test --prefix tools/operation-codegen
      - name: Test generated clients against isolated hosts
        shell: bash
        run: |
          families=(statements records evidence writes creation discussions ideation)
          test_args=()
          for family in "${families[@]}"; do
            test_args+=(--test "$family")
          done
          cargo test --locked -p provenance-http-client "${test_args[@]}" --no-run --timings
          # Each family has a separate temporary repository and host port.
          # Cargo locks the shared build directory during fixture builds.
          printf '%s\0' "${families[@]}" | xargs -0 -n 1 -P 4 node tools/operation-codegen/test-clients.mjs
      - run: git diff --exit-code
      - name: Save Cargo timing reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-timings-operation-contract
          path: target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 30

  repository-file-access:
    name: Repository file access (${{ matrix.target }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.file-access-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: repository-file-access-${{ matrix.target }}
      - run: cargo test --locked -p provenance-store --target ${{ matrix.target }} operations::files

  # The one status the branch ruleset requires. Conditional jobs skip when a
  # pull request leaves their inputs untouched, and a skipped matrix job never
  # reports its expanded name, so requiring the jobs directly deadlocks a
  # state-only pull request. This job always runs and fails when any needed
  # job failed or was cancelled; skipped counts as success.
  ci-ok:
    name: CI OK
    needs:
      - changes
      - generate-operations
      - review-assets
      - fmt
      - clippy
      - test
      - test-default-features
      - build-cli-linux
      - build-cli-platforms
      - rule-coverage
      - rust-sdk
      - typescript-sdk
      - typescript-sdk-example
      - initializer
      - typescript-sdk-packed-install
      - release-smoke-tools
      - operation-contract
      - repository-file-access
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check needed job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[.[] | select(.result == "failure" or .result == "cancelled")] | length')
          test "$bad" -eq 0
