name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Required checks skipped via `if:` count as passed for the main ruleset,
  # so jobs whose inputs are untouched can skip without renaming anything.
  # Pushes to main always run every job; the filters only narrow PRs.
  changes:
    name: Detect changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      sdk: ${{ steps.filter.outputs.sdk }}
      release: ${{ steps.filter.outputs.release }}
      test-matrix: ${{ steps.matrices.outputs.test }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            ci: &ci
              - ".github/workflows/ci.yml"
            release: &release
              - *ci
              - ".gitattributes"
              - ".github/release-targets.json"
              - ".github/workflows/release.yml"
              - ".github/workflows/release-smoke.yml"
              - ".github/scripts/**/*.sh"
              - ".github/scripts/**/*.py"
            rust:
              - *ci
              - *release
              - ".github/scripts/publish-cargo-if-missing.sh"
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "examples/rust-sdk/**"
              # Skill files are Rust inputs: the sources compile into the
              # binary with include_str!, and a test compares the installed
              # copies against what an install writes.
              - "skills/**"
              - ".agents/skills/**"
              - ".claude/skills/**"
            sdk:
              - *ci
              - "packages/**"
              - "examples/typescript-sdk/**"
      # Pull requests run the Test job on Linux only; pushes to main add the
      # windows/macos legs. The packed-install matrix stays static on every
      # event: release_onboarding_structure.rs pins it to release-targets.json.
      - name: Select platform matrices for the event
        id: matrices
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo 'test={"os":["ubuntu-latest"]}' >> "$GITHUB_OUTPUT"
          else
            echo 'test={"os":["ubuntu-latest","macos-latest","windows-latest"]}' >> "$GITHUB_OUTPUT"
          fi

  # One build per OS. Every job that only needs to drive the CLI downloads
  # this artifact instead of compiling the workspace itself; cargo test and
  # clippy still build their own profiles. The linux build is its own job so
  # the linux-only consumers do not wait on the platform builds; the packed
  # matrix needs both.
  build-cli-linux:
    name: Build provenance-cli (linux)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          prefix-key: v1
          shared-key: build-cli
          add-job-id-key: "false"
          cache-on-failure: true
      - run: cargo build -p provenance-cli
      - name: Upload the CLI for the consumer jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-cli-x86_64-unknown-linux-gnu
          path: target/debug/provenance
          retention-days: 1

  build-cli-platforms:
    name: Build provenance-cli (${{ matrix.target }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            binary: provenance.exe
          - os: blacksmith-6vcpu-macos-15
            target: x86_64-apple-darwin
            binary: provenance
          - os: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            binary: provenance
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          prefix-key: v1
          shared-key: build-cli
          add-job-id-key: "false"
          cache-on-failure: true
      - run: cargo build -p provenance-cli
      - name: Upload the CLI for the consumer jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-cli-${{ matrix.target }}
          path: target/debug/${{ matrix.binary }}
          retention-days: 1

  fmt:
    name: Format
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy
      # Own cache key: clippy saves check-profile artifacts, and the first
      # saver owns a key, so sharing would hand build jobs a useless cache.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          prefix-key: v1
          shared-key: clippy
          add-job-id-key: "false"
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          prefix-key: v1
          shared-key: rust
          add-job-id-key: "false"
          cache-on-failure: true
      - run: cargo test --workspace --all-features --no-fail-fast

  # Default-features lane: runs the dogfood absence tests, which assert the
  # dev-only command does not exist in feature-less builds.
  test-default-features:
    name: Default-features CLI test
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          prefix-key: v1
          shared-key: rust
          add-job-id-key: "false"
          cache-on-failure: true
      - run: cargo test -p provenance-cli --no-fail-fast

  rule-coverage:
    name: Rule Coverage
    needs: [changes, build-cli-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-cli-x86_64-unknown-linux-gnu
          path: target/debug
      - run: chmod +x target/debug/provenance
      - run: target/debug/provenance coverage scan --repo . --path crates --scope default --validate-rules --strict
      - name: Validate initializer Rule bindings
        run: target/debug/provenance coverage scan --repo . --path packages/create-provenance --scope default --validate-rules --strict

  rust-sdk:
    name: Rust SDK example
    needs: [changes, build-cli-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-cli-x86_64-unknown-linux-gnu
          path: target/debug
      - run: chmod +x target/debug/provenance
      - name: Run Rust fixture
        shell: bash
        run: |
          fixture_repo="$PWD/examples/rust-sdk"
          target/debug/provenance init --path "$fixture_repo" --scope default --path-prefix .
          (cd examples/rust-sdk && PROVENANCE_REPO="$fixture_repo" cargo run --bin apply)
          (cd examples/rust-sdk && \
            PROVENANCE_REPO="$fixture_repo" \
            PROVENANCE_VERIFICATION_OWNER="ci://rust-example" \
            cargo test)
          rule_id=$(target/debug/provenance rules list \
            --repo "$fixture_repo" --scope default --format json \
            | jq -er 'select(length == 1) | .[0].id')
          target/debug/provenance rules show \
            --repo "$fixture_repo" --scope default --id "$rule_id" --format json
          target/debug/provenance sdk verification-runs \
            --repo "$fixture_repo" --scope default --rule "$rule_id" --format json \
            | jq -e 'length == 1 and .[0].status == "passed"'
          target/debug/provenance sdk verification-bindings \
            --repo "$fixture_repo" --scope default --rule "$rule_id" --format json \
            | jq -e 'length == 1 and .[0].file == "tests/share_links.rs"'

  typescript-sdk:
    name: TypeScript SDK
    needs: [changes, build-cli-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/provenance/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-cli-x86_64-unknown-linux-gnu
          path: target/debug
      - run: chmod +x target/debug/provenance
      - run: npm ci --prefix packages/provenance
      - run: npm test --prefix packages/provenance
      # Bun eliminates the calling frame of a tail call, so a verify call that
      # states no file only reproduces here.
      - run: npm run test:bun --prefix packages/provenance

  typescript-sdk-example:
    name: TypeScript SDK example
    needs: [changes, build-cli-linux]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/provenance/package-lock.json
            examples/typescript-sdk/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-cli-x86_64-unknown-linux-gnu
          path: target/debug
      - run: chmod +x target/debug/provenance
      - run: npm ci --prefix packages/provenance
      - run: npm run build --prefix packages/provenance
      - run: npm ci --prefix examples/typescript-sdk
      - name: Run packaged fixture
        shell: bash
        run: |
          fixture_repo="$PWD/examples/typescript-sdk"
          target/debug/provenance init --path "$fixture_repo" --scope default --path-prefix .
          PROVENANCE_BIN="$PWD/target/debug/provenance" \
          PROVENANCE_REPO="$fixture_repo" \
          PROVENANCE_SPEC_OWNER="spec://typescript/share-links" \
          PROVENANCE_VERIFICATION_OWNER="ci://typescript-example" \
          npm test --prefix examples/typescript-sdk
          rule_id=$(target/debug/provenance rules list \
            --repo "$fixture_repo" --scope default --format json \
            | jq -er 'select(length == 1) | .[0].id')
          target/debug/provenance rules show \
            --repo "$fixture_repo" --scope default --id "$rule_id" --format json
          target/debug/provenance sdk verification-runs \
            --repo "$fixture_repo" --scope default --rule "$rule_id" --format json \
            | jq -e 'length == 1 and .[0].status == "passed"'
          target/debug/provenance sdk verification-bindings \
            --repo "$fixture_repo" --scope default --rule "$rule_id" --format json \
            | jq -e 'length == 1 and .[0].file == "dist/share-links.test.js"'

  # One job, six managers: each smoke is seconds long, and six matrix legs
  # cost six runners to save one check row.
  initializer:
    name: Initializer
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.sdk == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/create-provenance/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.9.3
      - uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          nub-version: 0.7.5
      - name: Enable Corepack package managers
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          corepack prepare yarn@4.9.2 --activate
      - run: npm ci --prefix packages/create-provenance
      - run: npm test --prefix packages/create-provenance
      - name: Package-manager smoke tests
        run: |
          for manager in npm bun deno pnpm yarn nub; do
            echo "== smoke test: $manager =="
            PROVENANCE_TEST_PACKAGE_MANAGER="$manager" \
              npm run test:manager-smoke --prefix packages/create-provenance
          done

  typescript-sdk-packed-install:
    name: Packaged SDK install (${{ matrix.target }})
    needs: [changes, build-cli-linux, build-cli-platforms]
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.sdk == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
            yarn-pnp: true
          - os: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            yarn-pnp: false
          - os: blacksmith-6vcpu-macos-15
            target: x86_64-apple-darwin
            yarn-pnp: false
          - os: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            yarn-pnp: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/provenance/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance-cli-${{ matrix.target }}
          path: target/debug
      - run: chmod +x target/debug/provenance
        if: runner.os != 'Windows'
      - name: Enable Yarn Plug'n'Play test
        if: matrix.yarn-pnp
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate
      - run: npm ci --prefix packages/provenance
      - run: npm run build --prefix packages/provenance
      - run: npm run test:packed --prefix packages/provenance
        env:
          PROVENANCE_TEST_YARN_PNP: ${{ matrix.yarn-pnp }}

  release-smoke-tools:
    name: Release tools (${{ matrix.os }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-6vcpu-macos-15
          - blacksmith-4vcpu-windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Parse release shell scripts
        shell: bash
        run: bash -n .github/scripts/*.sh .github/scripts/release-smoke/*.sh
      - name: Verify archive extraction tool
        shell: bash
        run: |
          source .github/scripts/release-smoke/lib.sh
          temporary=$(make_smoke_directory release-tar)
          trap 'rm -rf -- "$temporary"' EXIT
          mkdir -p "$temporary/source" "$temporary/extracted"
          printf 'archive fixture\n' > "$temporary/source/file.txt"
          if [[ "$RUNNER_OS" == Windows ]]; then
            archive="$temporary/fixture.zip"
          else
            archive="$temporary/fixture.tar.gz"
          fi
          python - "$temporary/source/file.txt" "$archive" <<'PY'
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          archive = Path(sys.argv[2])
          if archive.suffix == ".zip":
              with zipfile.ZipFile(archive, "w") as contents:
                  contents.write(source, "file.txt")
          else:
              with tarfile.open(archive, "w:gz") as contents:
                  contents.add(source, "file.txt")
          PY
          python .github/scripts/release-smoke/extract_archive.py \
            "$archive" "$temporary/extracted"
          cmp "$temporary/source/file.txt" "$temporary/extracted/file.txt"
      - name: Run ShellCheck
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck .github/scripts/*.sh .github/scripts/release-smoke/*.sh
      - name: Install workflow validator
        if: matrix.os == 'ubuntu-latest'
        env:
          GOBIN: ${{ runner.temp }}/release-tools
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate workflows
        if: matrix.os == 'ubuntu-latest'
        env:
          GOBIN: ${{ runner.temp }}/release-tools
        run: '"$GOBIN/actionlint"'
      - name: Test release smoke helpers
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash .github/scripts/release-smoke/test.sh

  # The one status the branch ruleset requires. Conditional jobs skip when a
  # pull request leaves their inputs untouched, and a skipped matrix job never
  # reports its expanded name, so requiring the jobs directly deadlocks a
  # state-only pull request. This job always runs and fails when any needed
  # job failed or was cancelled; skipped counts as success.
  ci-ok:
    name: CI OK
    needs:
      - changes
      - fmt
      - clippy
      - test
      - test-default-features
      - build-cli-linux
      - build-cli-platforms
      - rule-coverage
      - rust-sdk
      - typescript-sdk
      - typescript-sdk-example
      - initializer
      - typescript-sdk-packed-install
      - release-smoke-tools
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check needed job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[.[] | select(.result == "failure" or .result == "cancelled")] | length')
          test "$bad" -eq 0
