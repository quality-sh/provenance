name: Simulation

# Random cases of the write engine, run nightly and on dispatch, never on a
# pull request. Each job is one layer, so a failure names the layer. A broken
# law opens one issue per layer and law, or comments on the open one.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: "Cases per random test (HEGEL_TEST_CASES); empty keeps the default"
        required: false
        default: ""
      seed:
        description: "Seed (HEGEL_SEED); empty uses the run ID"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: false

env:
  HEGEL_SEED: ${{ inputs.seed || github.run_id }}
  HEGEL_TEST_CASES: ${{ inputs.cases }}
  # The blob replays a shrunk case on any system; print it with the failure.
  HEGEL_PRINT_BLOB: "true"

jobs:
  layer:
    # The engine and the contract layers run the same cases on Linux: they
    # have no file or process code.
    name: Simulation of the ${{ matrix.layer }} layer
    strategy:
      fail-fast: false
      matrix:
        layer: [engine, contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LAYER: ${{ matrix.layer }}
      SIMULATION_FAILURE_DIR: ${{ github.workspace }}/target/simulation/failures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-socket-firewall
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1
          shared-key: simulation
          add-job-id-key: "false"
      - name: Fetch crates through Socket Firewall
        run: sfw cargo fetch --locked
      - name: Install nextest
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: nextest@0.9.143
      - name: Run the simulation
        shell: bash
        run: |
          mkdir -p target/simulation
          set -o pipefail
          cargo nextest run --locked --profile simulation --run-ignored all \
            -p provenance-simulation --test "$LAYER" --no-fail-fast 2>&1 \
            | tee "target/simulation/$LAYER.log"
      - name: Report broken laws
        if: failure()
        run: >-
          python3 .github/scripts/simulation_report.py summary
          --layer "$LAYER" --log "target/simulation/$LAYER.log"
          --failures target/simulation/failures >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: simulation-${{ matrix.layer }}
          path: target/simulation
          if-no-files-found: ignore

  report:
    name: Open issues for broken laws
    needs: [layer]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: simulation-*
          path: target/simulation
      - name: Open or update one issue per layer and law
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 .github/scripts/simulation_report.py issues
          --artifacts target/simulation --run-url "$RUN_URL"
