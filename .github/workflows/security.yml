name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly run so new advisories surface without a triggering change.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-audit:
    name: Cargo audit (RustSec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # The scan range follows the event:
  # - pull_request: only the commits of the pull request (base..head).
  # - push to main: all of the history of main.
  # - schedule and workflow_dispatch: all refs, which includes the public
  #   snapshot branches that the cargo CI shim pushes.
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    steps:
      # The full history is necessary for each range above.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              git cat-file -e "$BASE_SHA^{commit}"
              git cat-file -e "$HEAD_SHA^{commit}"
              log_opts="$BASE_SHA..$HEAD_SHA"
              ;;
            push)
              log_opts="$GITHUB_SHA"
              ;;
            *)
              log_opts="--full-history --all"
              ;;
          esac
          echo "gitleaks log options: $log_opts"
          ./gitleaks git . --no-banner --redact --exit-code 1 --log-opts="$log_opts"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
