name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly run so new advisories surface without a triggering change.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-audit:
    name: Cargo audit (RustSec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  # The scan range follows the event:
  # - pull_request: the commits of the pull request that main does not
  #   contain. This also covers a pull request with a base other than main.
  # - push to main: all of the history of main.
  # - schedule and workflow_dispatch: all refs. Agent Cargo verification
  #   scans each snapshot when the cargo CI shim pushes it.
  # --diff-merges=first-parent also scans the changes that a merge commit
  # makes, which includes conflict resolutions.
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    steps:
      # The full history and origin/main are necessary for each range above.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          # From gitleaks_8.24.3_checksums.txt of the same release.
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Test the scan script
        env:
          GITLEAKS: ${{ runner.temp }}/gitleaks
        run: python3 .github/scripts/gitleaks-scan.test.py
      - name: Scan commits
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS: ${{ runner.temp }}/gitleaks
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git cat-file -e "$HEAD_SHA^{commit}"
              git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null
              log_opts="--diff-merges=first-parent $HEAD_SHA --not origin/main"
              ;;
            push)
              log_opts="--diff-merges=first-parent $GITHUB_SHA"
              ;;
            *)
              log_opts="--diff-merges=first-parent --full-history --all"
              ;;
          esac
          .github/scripts/gitleaks-scan.sh "$log_opts"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
