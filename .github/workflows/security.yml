name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly run so new advisories surface without a triggering change.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-audit:
    name: Cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    # Hard ceiling for the job, dominated by the audit step below: its worst
    # case is ~3.5 minutes (3 attempts x 60s fetch timeout + 10s + 20s of
    # backoff), so 6 minutes is that worst case plus headroom. No registry
    # behavior can turn this job into a twelve-minute sit again.
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - packages/create-provenance
          - packages/provenance
          # examples/typescript-sdk is deliberately absent. Its only runtime dependency is a
          # file: link to packages/provenance and its only registry dependency is typescript,
          # both already audited by the legs above, so the leg added no coverage; the file: link
          # also makes npm's fallback advisory request fail with "Invalid package tree", turning
          # any hiccup on the bulk endpoint into a hard failure. Dependabot and the Socket scan
          # still watch that lockfile. Re-add it only once it gains a registry dependency of its
          # own.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Why this step wraps the audit in a retry: `npm audit` first POSTs the
      # lockfile tree to /-/npm/v1/security/advisories/bulk and only falls back
      # to /-/npm/v1/security/audits/quick when that request fails at the
      # transport level. The bulk endpoint intermittently hangs or 5xx-s, and
      # the fallback is an endpoint npm's own notice says is being retired
      # which also rejects some lockfiles with 400 "Invalid package tree", so
      # a transient registry hiccup becomes a hard red build with no advisory
      # involved. Four such failures were observed on 2026-09-04, all registry
      # transport errors and none reporting a vulnerability:
      #   - root: 7m7s — bulk request hung out the full 300s fetch timeout,
      #     then the legacy fallback returned 503 Service Unavailable.
      #   - root, later the same day: legacy fallback returned 400 Bad Request.
      #   - root: the same leg passed on a plain re-run in between, with no
      #     change — the failures are transient, not deterministic.
      #   - examples/typescript-sdk: bulk request hung for 300s, fallback
      #     returned 400 "Invalid package tree" (that leg has since been
      #     removed from the matrix for unrelated structural reasons; see the
      #     note above).
      #
      # The timeout settings are fail-fast, not "give npm more room". npm's
      # fetch layer never retries POST requests (make-fetch-happen), and both
      # audit endpoints are POSTs, so fetch-retries and its backoff bounds
      # cannot help the audit call at all — they are deliberately omitted,
      # because setting them would only add confusion. The only knob that
      # matters is fetch-timeout, tightened from the 300s default to 60s: a
      # healthy registry answers the audit in under a minute (the passing legs
      # took 8s and 52s), while the failing legs show a hung bulk request
      # burns the entire window before npm falls back — so a longer timeout
      # does not make a hung request more likely to answer, it only makes the
      # wait slower. 60s is generous for a live registry and abandons a hung
      # request quickly, handing control to the loop below, which is what
      # actually re-runs the audit after a transport failure.
      #
      # This retry is NOT a bypass. `npm audit` exits non-zero both on registry
      # transport errors and when it finds a vulnerability at or above
      # --audit-level=high (which is unchanged), so a genuine high/critical
      # finding still fails the job after the three attempts — it just fails a
      # couple of minutes later. Only transient transport errors are absorbed.
      - name: npm audit (up to 3 attempts; retries absorb registry transport errors, not findings)
        working-directory: ${{ matrix.directory }}
        env:
          # fetch-retries / fetch-retry-mintimeout / fetch-retry-maxtimeout are
          # deliberately not set: npm never retries POST requests and both
          # audit endpoints are POSTs, so those knobs cannot help the audit
          # call and only add confusion (see the longer comment above).
          NPM_CONFIG_FETCH_TIMEOUT: "60000"
        run: |
          # Bounded retry: at most 3 attempts with doubling backoff (10s, 20s).
          # The job fails if the last attempt fails. npm audit also exits
          # non-zero when it finds a real vulnerability, so a genuine finding
          # still fails the build after the attempts — this loop changes when
          # we give up, never what counts as a failure.
          max_attempts=3
          backoff_seconds=10
          attempt=1
          until npm audit --audit-level=high; do
            audit_status=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::npm audit still failing after ${attempt}/${max_attempts} attempts (last exit ${audit_status}). A vulnerability at or above --audit-level=high exits non-zero exactly like a transport error, so fix the finding if one is reported; only re-run if this is registry flakiness (bulk hang, or 4xx/5xx from the retiring quick-audit fallback)."
              exit "$audit_status"
            fi
            echo "npm audit attempt ${attempt}/${max_attempts} exited ${audit_status}; retrying in ${backoff_seconds}s."
            sleep "$backoff_seconds"
            attempt=$((attempt + 1))
            backoff_seconds=$((backoff_seconds * 2))
          done
          echo "npm audit passed on attempt ${attempt}/${max_attempts}."

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git . --no-banner --redact --exit-code 1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
