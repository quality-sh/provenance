name: Post-release installation smoke tests

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version without a leading v (for example, 0.2.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ inputs.version || github.event.release.tag_name || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  RELEASE_SMOKE_RETRY_ATTEMPTS: "20"
  RELEASE_SMOKE_RETRY_DELAY_SECONDS: "30"

jobs:
  cargo-registry:
    name: crates.io installation
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Install and exercise the exact Rust distribution
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="$DISPATCH_VERSION"
          if [[ "${{ github.event_name }}" == release ]]; then
            version="${RELEASE_TAG#v}"
          elif [[ "${{ github.event_name }}" == workflow_run ]]; then
            version="${WORKFLOW_TAG#v}"
          fi
          bash .github/scripts/release-smoke/cargo-registry.sh "$version"

  npm-registry:
    name: npm installation
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install and exercise the exact npm distribution
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="$DISPATCH_VERSION"
          if [[ "${{ github.event_name }}" == release ]]; then
            version="${RELEASE_TAG#v}"
          elif [[ "${{ github.event_name }}" == workflow_run ]]; then
            version="${WORKFLOW_TAG#v}"
          fi
          bash .github/scripts/release-smoke/npm-registry.sh "$version"

  github-archive:
    name: GitHub archive (${{ matrix.target }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
      - name: Verify and execute the native archive
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          WORKFLOW_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          version="$DISPATCH_VERSION"
          if [[ "${{ github.event_name }}" == release ]]; then
            version="${RELEASE_TAG#v}"
          elif [[ "${{ github.event_name }}" == workflow_run ]]; then
            version="${WORKFLOW_TAG#v}"
          fi
          bash .github/scripts/release-smoke/github-archive.sh \
            "$version" "${{ matrix.target }}" "${{ matrix.archive }}"
