[package]
name = "provenance-ste100"
version.workspace = true
edition.workspace = true
description = "ASD-STE100 statement checks for Provenance Requirements and Rules"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
schema = ["dep:schemars"]

[dependencies]
schemars = { workspace = true, optional = true }
fs2.workspace = true
# pdf_oxide 0.3.77 requires the DocumentIR shape from office_oxide 0.1.8 through 0.1.11.
# Raise this ceiling only after pdf_oxide initializes new DocumentIR fields.
office_oxide = { version = ">=0.1.8, <0.1.12", default-features = false }
pdf_oxide = { version = "=0.3.77", default-features = false, features = ["legacy-crypto"] }
provenance-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
jsonschema = { workspace = true, features = ["draft202012"] }
tempfile.workspace = true
