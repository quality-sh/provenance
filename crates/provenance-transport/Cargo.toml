[package]
name = "provenance-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Internal part of Provenance for transport and local access"
repository.workspace = true
readme.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
# The transport adapters, the HTTP host and the local-disk work. Without it the
# crate has the init summary and the ignore-file projection, and it builds for
# wasm32-unknown-unknown. Each consumer of the adapters turns it on.
host = [
    "dep:axum",
    "dep:fs2",
    "dep:provenance-contract",
    "dep:provenance-report",
    "dep:provenance-scanner",
    "dep:provenance-ste100",
    "dep:provenance-store",
    "provenance-store/host",
    "dep:pulldown-cmark",
    "dep:semver",
    "dep:url",
    "dep:uuid",
    "dep:ureq",
    "dep:tokio-util",
    "dep:tokio",
    "dep:dunce",
    "dep:walkdir",
    "dep:tempfile",
    "dep:remove_dir_all",
]
test-fixture = ["host", "provenance-store/test-fixture"]
# Dev-only agent feedback capture. Never enable in release builds.
dogfood = ["host"]

[dependencies]
anyhow.workspace = true
tempfile = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
camino.workspace = true
fs2 = { workspace = true, optional = true }
provenance-core.workspace = true
provenance-macros.workspace = true
provenance-porcelain.workspace = true
provenance-contract = { workspace = true, optional = true }
provenance-report = { workspace = true, optional = true }
provenance-scanner = { workspace = true, optional = true }
provenance-ste100 = { workspace = true, optional = true }
provenance-store = { workspace = true, features = ["schema"], optional = true }
pulldown-cmark = { workspace = true, optional = true }
remove_dir_all = { workspace = true, optional = true }
serde_json.workspace = true
serde.workspace = true
semver = { workspace = true, optional = true }
serde_ignored.workspace = true
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
tokio = { workspace = true, features = ["sync", "io-util", "io-std", "rt", "time"], optional = true }
dunce = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
sqlx.workspace = true
futures = "0.3"
provenance-macros.workspace = true
provenance-ste100.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "statement-host-fixture"
path = "src/bin/statement-host-fixture.rs"
required-features = ["host", "test-fixture"]

[[bin]]
name = "records-host-fixture"
path = "src/bin/records-host-fixture.rs"
required-features = ["host", "test-fixture"]

[[bin]]
name = "existing-root-host-fixture"
path = "src/bin/existing-root-host-fixture.rs"
required-features = ["host", "test-fixture"]

# Cargo does not find the test targets itself. Each group binary in
# tests/<group>/main.rs compiles test files of tests/ as its modules, because
# each test binary links the full dependency tree. Each other file listed
# here is a test binary of its own. cli_structure checks that each test file
# is in one of these targets.
[[test]]
name = "routes"
path = "tests/routes/main.rs"
required-features = ["host"]

[[test]]
name = "local_host"
path = "tests/local_host.rs"
required-features = ["test-fixture"]

# It sets the home, temporary and working directories of the process.
[[test]]
name = "router_port"
path = "tests/router_port.rs"
required-features = ["test-fixture"]

# Each test uses the adapters, so each test needs host.
[[test]]
name = "host_invocation"
required-features = ["host"]

[[test]]
name = "host_queue"
required-features = ["host"]

[[test]]
name = "page_write_response"
required-features = ["host"]

