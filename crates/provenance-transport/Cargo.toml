[package]
name = "provenance-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Internal part of Provenance for transport and local access"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-fixture = ["dep:tempfile", "provenance-store/test-fixture"]

[dependencies]
anyhow.workspace = true
tempfile = { workspace = true, optional = true }
axum.workspace = true
camino.workspace = true
fs2.workspace = true
jsonschema.workspace = true
provenance-core.workspace = true
provenance-macros.workspace = true
provenance-porcelain.workspace = true
provenance-contract.workspace = true
provenance-report.workspace = true
provenance-scanner.workspace = true
provenance-ste100.workspace = true
provenance-store = { workspace = true, features = ["schema"] }
pulldown-cmark.workspace = true
serde_json.workspace = true
serde.workspace = true
semver.workspace = true
serde_ignored.workspace = true
ureq.workspace = true
url.workspace = true
uuid.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { workspace = true, features = ["sync", "io-util", "io-std", "rt", "time"] }
dunce.workspace = true
walkdir.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
jsonschema.workspace = true
sqlx.workspace = true
futures = "0.3"
provenance-macros.workspace = true
provenance-ste100.workspace = true
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "statement-host-fixture"
path = "src/bin/statement-host-fixture.rs"
required-features = ["test-fixture"]

[[bin]]
name = "records-host-fixture"
path = "src/bin/records-host-fixture.rs"
required-features = ["test-fixture"]

[[bin]]
name = "existing-root-host-fixture"
path = "src/bin/existing-root-host-fixture.rs"
required-features = ["test-fixture"]

[[test]]
name = "local_host"
path = "tests/local_host.rs"
required-features = ["test-fixture"]
