[package]
name = "provenance-store"
version.workspace = true
edition.workspace = true
description = "Git-backed graph storage for Provenance requirements traceability"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
schema = ["dep:schemars", "provenance-core/schema", "provenance-ste100/schema"]

[dependencies]
serde_path_to_error = "=0.1.20"
schemars = { workspace = true, optional = true }
anyhow.workspace = true
camino.workspace = true
fs2.workspace = true
provenance-core.workspace = true
provenance-macros.workspace = true
provenance-scanner.workspace = true
provenance-ste100.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
uuid.workspace = true
hmac = "0.12.1"
base64 = "0.22.1"

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
fs_at.workspace = true
windows-sys.workspace = true

[dev-dependencies]
fs_at.workspace = true
jsonschema = { workspace = true, features = ["draft202012"] }
filetime.workspace = true
trybuild.workspace = true
