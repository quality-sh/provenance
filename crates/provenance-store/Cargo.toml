[package]
name = "provenance-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Internal part of Provenance for Git-backed graph storage"
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
autotests = false

[lints]
workspace = true

[features]
schema = ["dep:schemars", "provenance-core/schema", "provenance-ste100/schema"]
test-fixture = []
# The repository engine and its local-disk mechanics. Without it the crate has
# the storage port, the memory adapter and canonical digests, and it builds for
# wasm32-unknown-unknown. Each consumer of the engine turns it on.
host = [
    "dep:fs2",
    "dep:fs_at",
    "dep:tempfile",
    "dep:sqlx",
    "dep:libsqlite3-sys",
    "dep:tokio",
    "dep:dunce",
    "dep:hmac",
    "dep:base64",
    "dep:provenance-scanner",
    "provenance-ste100/host",
    "dep:rustix",
    "dep:windows-sys",
]

[dependencies]
time.workspace = true
schemars = { workspace = true, optional = true }
anyhow.workspace = true
camino.workspace = true
fs2 = { workspace = true, optional = true }
fs_at = { workspace = true, optional = true }
# The async mutex of the read snapshot, which builds without Tokio.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex.workspace = true
provenance-core.workspace = true
provenance-macros.workspace = true
provenance-scanner = { workspace = true, optional = true }
provenance-ste100.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["time"], optional = true }
uuid.workspace = true
hmac = { version = "0.13", optional = true }
base64 = { version = "0.22.1", optional = true }
libsqlite3-sys = { version = "0.30.1", optional = true }
dunce = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

# A wasm host has no system clock or random source of its own;
# time and uuid reach them through JavaScript.
[target.'cfg(target_arch = "wasm32")'.dependencies]
time = { workspace = true, features = ["wasm-bindgen"] }
uuid = { workspace = true, features = ["js"] }

# Cargo does not find the test targets itself. Each group binary in
# tests/<group>/main.rs compiles test files of tests/ as its modules, because
# each test binary links the full dependency tree. Each other file listed
# here is a test binary of its own. cli_structure checks that each test file
# is in one of these targets. discussion_support.rs is a module of other
# tests, not a target.
#
# The engine tests need host. The source scan tests in the source group and
# read_process_state run without it, and the memory adapter tests too.
[[test]]
name = "discussion"
path = "tests/discussion/main.rs"
required-features = ["host"]

[[test]]
name = "engine"
path = "tests/engine/main.rs"
required-features = ["host"]

[[test]]
name = "review"
path = "tests/review/main.rs"
required-features = ["host"]

[[test]]
name = "source"
path = "tests/source/main.rs"

[[test]]
name = "memory_repository"

[[test]]
name = "memory_repository_stage_reads"

[[test]]
name = "read_process_state"

[[test]]
name = "compile_fail"
required-features = ["host"]

[[test]]
name = "discover_without_current_directory"
required-features = ["host"]

[[test]]
name = "git_starts_use_the_helper"
required-features = ["host"]

[[test]]
name = "read_database_contract"
required-features = ["host", "test-fixture"]

[[test]]
name = "review_cost"
required-features = ["host"]

[[test]]
name = "history_git_process"
required-features = ["host"]

[[test]]
name = "history_text_memory"
required-features = ["host"]

[[test]]
name = "history_text_calls"
required-features = ["host"]

[[test]]
name = "history_git_children"
required-features = ["host"]

[[test]]
name = "review_history_head_move"
required-features = ["host"]

[[test]]
name = "rule_binding_integrity"
required-features = ["host"]

[[test]]
name = "review_guards"
required-features = ["host", "test-fixture"]

[[test]]
name = "discussion_containers"
required-features = ["host", "test-fixture"]

[dev-dependencies]
dunce.workspace = true
fs_at.workspace = true
jsonschema.workspace = true
filetime.workspace = true
tempfile.workspace = true
trybuild.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp"] }
