[package]
name = "provenance-review"
version.workspace = true
edition.workspace = true
description = "Internal part of Provenance for review links and the review host"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true
include = ["src/**", "tests/**", "Cargo.toml", "README.md"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
camino.workspace = true
provenance-core.workspace = true
provenance-macros.workspace = true
provenance-porcelain.workspace = true
provenance-store.workspace = true
provenance-transport = { path = "../provenance-transport", version = "0.3.2" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
ureq.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_System_SystemServices"] }

[dev-dependencies]
provenance-transport = { path = "../provenance-transport", version = "0.3.2", features = ["test-fixture"] }
tempfile.workspace = true
