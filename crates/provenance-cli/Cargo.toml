[package]
name = "provenance-cli"
version.workspace = true
default-run = "provenance"
edition.workspace = true
description = "Command-line interface for Provenance requirements traceability"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true
# Composed assets are prepared before packaging and are not tracked by Git.
include = ["src/**", "skills/**", "build.rs", "build/**", "review-assets/**", "review-assets-generated/**", "tests/**", "Cargo.toml", "README.md"]

[lints]
workspace = true

[[bin]]
name = "provenance"
path = "src/main.rs"

[[bin]]
name = "cargo-provenance"
path = "src/bin/cargo-provenance.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
camino.workspace = true
clap.workspace = true
fs_at.workspace = true
fs2.workspace = true
jsonschema.workspace = true
pulldown-cmark.workspace = true
provenance-core.workspace = true
provenance-macros.workspace = true
provenance-report.workspace = true
provenance-scanner.workspace = true
provenance-ste100.workspace = true
provenance-store.workspace = true
provenance-transport = { path = "../provenance-transport", version = "0.2.3" }
remove_dir_all.workspace = true
rustix.workspace = true
same-file.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
uuid.workspace = true
ureq.workspace = true
url.workspace = true
walkdir.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[features]
default = []
scanner = []
# Dev-only agent feedback capture. Never enable in release builds.
dogfood = []

[dev-dependencies]
assert_cmd.workspace = true
flate2.workspace = true
insta.workspace = true
pdf_oxide = { version = "=0.3.77", default-features = false, features = ["legacy-crypto"] }
jsonschema.workspace = true
tempfile.workspace = true
predicates.workspace = true
sha2.workspace = true
tar.workspace = true
