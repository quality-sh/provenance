[package]
name = "provenance-cli"
version.workspace = true
default-run = "provenance"
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface for Provenance requirements traceability"
license.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
# Bundled skills are prepared before packaging and are not tracked.
# Run node tools/skills/prepare.mjs before Cargo collects package files.
include = ["src/**", "skills/**", "build.rs", "build/**", "tests/**", "Cargo.toml", "README.md"]
autotests = false

[lints]
workspace = true

[[bin]]
name = "provenance"
path = "src/main.rs"

[[bin]]
name = "cargo-provenance"
path = "src/bin/cargo-provenance.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
camino.workspace = true
clap.workspace = true
fs2.workspace = true
jsonschema.workspace = true
hex.workspace = true
provenance-core.workspace = true
provenance-macros.workspace = true
provenance-mcp.workspace = true
provenance-porcelain.workspace = true
provenance-review.workspace = true
provenance-contract.workspace = true
provenance-transport = { path = "../provenance-transport", version = "0.4.0", features = ["host"] }
remove_dir_all.workspace = true
rustix.workspace = true
schemars.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["signal", "io-std", "io-util"] }
uuid.workspace = true
ureq.workspace = true
url.workspace = true
walkdir.workspace = true
dunce.workspace = true

[target.'cfg(not(windows))'.dependencies]
open.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_System_SystemServices"] }

[features]
default = []
scanner = []
# Dev-only agent feedback capture. Never enable in release builds.
dogfood = ["provenance-transport/dogfood"]

# Cargo does not find the test targets itself. Each group binary in
# tests/<group>/main.rs compiles test files of tests/ as its modules, because
# each test binary links the full dependency tree. Each other file listed
# here is a test binary of its own. cli_structure checks that each test file
# is in one of these targets.
[[test]]
name = "api"
path = "tests/api/main.rs"

[[test]]
name = "checks"
path = "tests/checks/main.rs"

[[test]]
name = "records"
path = "tests/records/main.rs"

[[test]]
name = "review"
path = "tests/review/main.rs"

[[test]]
name = "setup"
path = "tests/setup/main.rs"

[[test]]
name = "cargo_nested_sdk"

[[test]]
name = "ci_coverage_workflow"

[[test]]
name = "ci_wasm_kernel"

[[test]]
name = "cli_agent_review_records"

[[test]]
name = "cli_dogfood_simulate"

[[test]]
name = "cli_import_legacy_audit"

[[test]]
name = "cli_import_lifecycle"

[[test]]
name = "cli_init_onboarding"

[[test]]
name = "cli_init_summary"

[[test]]
name = "cli_review_events"

[[test]]
name = "cli_review_events_recovery"

[[test]]
name = "cli_review_events_security"

[[test]]
name = "cli_skills"

[[test]]
name = "cli_skills_build_source"

[[test]]
name = "cli_skills_cleanup"

[[test]]
name = "cli_skills_copy_tree"

[[test]]
name = "cli_skills_single_source"

[[test]]
name = "cli_ste_onboarding"

[[test]]
name = "cli_ste_onboarding_concurrency"

[[test]]
name = "cli_structure"

[[test]]
name = "cli_version"

[[test]]
name = "crate_dependencies"

[[test]]
name = "porcelain_notify_bindings"

[[test]]
name = "release_commands"

[[test]]
name = "release_onboarding_structure"

[[test]]
name = "release_structure"

[[test]]
name = "review_bundle"

[[test]]
name = "review_native_overflow_probe"

[[test]]
name = "simulation_cli"

[[test]]
name = "simulation_cli_planted"

[dev-dependencies]
pulldown-cmark.workspace = true
assert_cmd.workspace = true
flate2.workspace = true
pdf_oxide = { version = "=0.3.78", default-features = false, features = ["legacy-crypto"] }
jsonschema.workspace = true
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
tempfile.workspace = true
predicates.workspace = true
provenance-mcp = { workspace = true, features = ["client"] }
tar.workspace = true
provenance-store = { workspace = true, features = ["host"] }
provenance-ste100.workspace = true
# The test layout check (tests/cli_structure.rs) reads the module tree of
# each test target.
syn = { workspace = true, features = ["full"] }
provenance-transport = { path = "../provenance-transport", version = "0.4.0", features = ["test-fixture"] }
tokio = { workspace = true, features = ["process"] }
# The nightly simulation of the CLI (tests/simulation_cli.rs). The simulation
# crate does not publish, so the edge has no version.
hegeltest.workspace = true
provenance-simulation = { path = "../provenance-simulation" }
