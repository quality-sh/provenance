[package]
name = "provenance-http-client"
version.workspace = true
edition.workspace = true
description = "Internal part of Provenance for generated HTTP access"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true
# The source generator runs before packaging; consumers use these included files.
include = ["src/**", "Cargo.toml", "README.md"]

[lints]
workspace = true

# The library has no unit tests; the tests directory tests it. A unit test
# build compiles the whole generated client a second time, and on the Linux
# coverage leg the two compiles used about 7 GB of memory each.
[lib]
test = false

[dependencies]
chrono = { version = "=0.4.45", features = ["serde"] }
jsonschema = { version = "=0.60.2", default-features = false }
regress = "=0.11.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
