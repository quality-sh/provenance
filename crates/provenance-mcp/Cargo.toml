[package]
name = "provenance-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Internal part of Provenance for the MCP server"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# A small JSON MCP client for tests in other crates.
client = []
test-fixture = ["provenance-transport/test-fixture"]

[dependencies]
jsonschema.workspace = true
provenance-contract.workspace = true
provenance-core.workspace = true
provenance-macros.workspace = true
provenance-porcelain.workspace = true
provenance-transport = { path = "../provenance-transport", version = "0.4.0", features = ["host"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "client"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }

[dev-dependencies]
axum.workspace = true
futures = "0.3"
provenance-core.workspace = true
provenance-macros.workspace = true
provenance-porcelain.workspace = true
provenance-store = { workspace = true, features = ["host"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
